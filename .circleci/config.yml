version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  setup:
    executor: tools/clojurecli
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}
            - source-
      - checkout
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - .git
      - restore_cache:
          keys:
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: Resolve dependencies
          command: clojure -A:dev:test:cljs-test:build -P
      - save_cache:
          key: deps-{{ checksum "deps.edn" }}
          paths:
            - /home/circleci/.m2
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - replikativ

  format-check:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Check code formatting
          command: clojure -M:format

  test-clj:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run Clojure tests
          command: clojure -M:test
          no_output_timeout: 5m

  # konserve-sync is a .cljc library whose whole point is server-to-BROWSER sync,
  # and until now CI never compiled a line of ClojureScript. The JVM half passing
  # says nothing about the half that runs in a browser.
  test-cljs:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install npm dependencies
          command: npm install
      - run:
          name: Compile ClojureScript tests
          command: npx shadow-cljs compile test
          no_output_timeout: 5m
      - run:
          # Explicitly, rather than trusting the build's `:autorun`: a job that
          # cannot report failure is worse than no job at all. `node` exits
          # non-zero on a failing suite, so this is the actual gate.
          name: Run ClojureScript tests
          command: node target/test.js
          no_output_timeout: 5m

  build:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Build JAR
          command: clojure -T:build jar
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - replikativ

  deploy:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Deploy to Clojars
          command: clojure -T:build deploy

  release:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Create GitHub release
          command: clojure -T:build release

workflows:
  build-test-deploy:
    jobs:
      - setup:
          context: dockerhub-deploy
      - format-check:
          context: dockerhub-deploy
          requires:
            - setup
      - test-clj:
          context: dockerhub-deploy
          requires:
            - setup
      - test-cljs:
          context: dockerhub-deploy
          requires:
            - setup
      - build:
          context: dockerhub-deploy
          requires:
            - setup
      - deploy:
          context:
            - dockerhub-deploy
            - clojars-deploy
          filters:
            branches:
              only: main
          requires:
            - format-check
            - test-clj
            - test-cljs
            - build
      - release:
          context:
            - dockerhub-deploy
            - github-token
          filters:
            branches:
              only: main
          requires:
            - deploy
